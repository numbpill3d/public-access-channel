name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile neocities_sort.py
      - run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
